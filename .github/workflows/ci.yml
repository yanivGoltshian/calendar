name: CI

on:
  pull_request:
    branches: [main, ygoltshian-microsoft-wave-4-google-account-pricing]
  push:
    branches: [main, ygoltshian-microsoft-wave-4-google-account-pricing]
  workflow_call:

permissions:
  contents: read

jobs:
  release-regression:
    name: Isolated release regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated PostgreSQL and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          npx playwright install --with-deps chromium
      - name: Clean migrations, upgrade history, units, types, lint, build, DB handlers and browser flows
        env:
          TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: npm run test:release
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-regression-${{ github.sha }}
          if-no-files-found: warn
          path: |
            .test-runtime/**/app.log
            .test-runtime/**/postgres.log
            .test-runtime/**/success.json
            .test-runtime/**/*-coverage.json
            playwright-report/
            test-results/
