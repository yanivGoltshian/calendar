# ============================================================================
# פרישה ידנית בלבד — תבנית. אין טריגר אוטומטי (workflow_dispatch בלבד).
# ----------------------------------------------------------------------------
# מריצים רק לאחר אישור. ה-workflow בונה אימג', דוחף ל-GHCR, ומעדכן את
# Container App דרך פריסת Bicep. ראו docs/deployment-cost.md ל-runbook המלא
# ולרשימת הסודות הנדרשים ב-repository/environment secrets.
#
# דרישות מוקדמות (מוגדרות פעם אחת בשלב הפריסה המאושרת):
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC),
#            DATABASE_URL, SESSION_SECRET, OTP_PEPPER, APP_PUBLIC_URL
#   Variables: AZURE_RESOURCE_GROUP, AZURE_LOCATION
# ============================================================================

name: Deploy to Azure (manual)

# טריגר ידני בלבד — ללא push/pull_request. שום דבר לא רץ אוטומטית.
on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: "תג האימג' לבנייה ופרישה"
        required: false
        default: latest
      deployInfra:
        description: "להריץ פריסת Bicep (תשתית)?"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------- בנייה ודחיפה של האימג' ל-GHCR (חינם) ----------
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image reference
        id: meta
        run: |
          TAG="${{ github.event.inputs.imageTag }}"
          TAG="${TAG:-latest}"
          # GHCR דורש שם repository באותיות קטנות; הבעלים yanivGoltshian מעורב אותיות.
          IMAGE_LC="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_LC}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.APP_PUBLIC_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- פריסת תשתית ועדכון האפליקציה ----------
  deploy:
    # מדולג כברירת מחדל: הפריסה בפועל מתבצעת ידנית דרך az. ה-job הזה רץ רק כאשר
    # מוגדר משתנה ENABLE_AZURE_DEPLOY=true (כלומר כשסודות ה-OIDC של Azure קיימים),
    # כדי שהרצת הפריסה לא תיכשל ותשלח מיילי כשל על כל פריסה מוצלחת של build-and-push.
    if: ${{ vars.ENABLE_AZURE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (infrastructure)
        if: ${{ github.event.inputs.deployInfra == 'true' }}
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            infra/main.parameters.example.json
            containerImage=${{ needs.build-and-push.outputs.image }}
            appPublicUrl=${{ secrets.APP_PUBLIC_URL }}
            databaseUrl=${{ secrets.DATABASE_URL }}
            sessionSecret=${{ secrets.SESSION_SECRET }}
            otpPepper=${{ secrets.OTP_PEPPER }}
            firebaseProjectId=${{ secrets.FIREBASE_PROJECT_ID }}
            firebaseClientEmail=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            firebasePrivateKey=${{ secrets.FIREBASE_PRIVATE_KEY }}
            firebaseWebApiKey=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            firebaseWebAuthDomain=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            firebaseWebProjectId=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            firebaseWebAppId=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            firebaseWebMessagingSenderId=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          failOnStdErr: false

      - name: Update Container App image (fast path, ללא שינוי תשתית)
        if: ${{ github.event.inputs.deployInfra != 'true' }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name torchick-app-prod \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ needs.build-and-push.outputs.image }}"

      - name: Azure logout
        if: always()
        run: az logout || true
