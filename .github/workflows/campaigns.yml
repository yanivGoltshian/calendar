# ============================================================================
# קמפיינים מתוזמנים — טריגר מתוזמן שקורא ל-endpoint בפרודקשן.
# ----------------------------------------------------------------------------
# רץ כל 5 דקות (וגם ידנית), ומפעיל את POST /api/cron/campaigns עם כותרת הסוד.
# ה-endpoint עצמו מוצא קמפיינים במצב SCHEDULED שהגיע מועדם (scheduledAt <= now),
# שולח אותם בערוצים שנבחרו ומסמן אידמפוטנטית (תפיסה אטומית מונעת שליחה כפולה).
#
# דרישות סוד (חייבות להיות מוגדרות באותו ערך בשני המקומות):
#   1) Repository secret בשם CRON_SECRET   — נשלח ככותרת x-cron-secret.
#   2) משתנה סביבה CRON_SECRET על ה-Container App (torchick-app-prod) —
#      מולו ה-endpoint משווה. אם הערכים לא תואמים יתקבל 401.
#   בנוסף: Repository secret בשם APP_PUBLIC_URL עם כתובת הפרודקשן
#   (למשל https://torchick.com), ממנה נבנית כתובת ה-endpoint.
# ============================================================================

name: Campaigns (scheduled)

on:
  schedule:
    # כל 5 דקות — רזולוציית התזמון של קמפיינים מתוזמנים.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: campaigns-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger campaigns endpoint
        env:
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_PUBLIC_URL:-}" ]; then
            echo "APP_PUBLIC_URL secret is not set" >&2
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is not set" >&2
            exit 1
          fi
          BASE="${APP_PUBLIC_URL%/}"
          URL="${BASE}/api/cron/campaigns"
          echo "POST ${URL}"
          # ‎-sS שקט אך מדווח שגיאות; מפרידים גוף מסטטוס לצורך בדיקה.
          BODY_FILE="$(mktemp)"
          CODE="$(curl -sS -o "${BODY_FILE}" -w '%{http_code}' \
            -X POST "${URL}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H 'content-type: application/json' \
            --max-time 60 || true)"
          echo "HTTP ${CODE}"
          echo "Response:"; cat "${BODY_FILE}" || true; echo
          if [ "${CODE}" != "200" ]; then
            echo "Campaigns endpoint returned non-200 (${CODE})" >&2
            exit 1
          fi
