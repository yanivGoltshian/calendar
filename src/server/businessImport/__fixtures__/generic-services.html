<!doctype html>
<html lang="he">
  <head>
    <title>שירותים</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

            "@type": "Offer",
            "price": "250",

          {

              "priceCurrency": "ILS"
            }
          }
        ]
      }

  </head>
  <body>
    <article class="service-card">
      <h2>טיפול פנים</h2>
      <p>טיפול פנים מותאם אישית.</p>
      <span class="price">250 ₪</span>

      <img src="/images/facial.jpg" width="800" height="600" alt="טיפול פנים" />

</html>
